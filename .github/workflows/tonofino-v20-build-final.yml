name: TonoFino v2.0 final Android QA

on:
  push:
    branches: [build/tonofino-v2.0-music-lab]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct TonoFino 2 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9017752309/zip" -o base.zip
          mkdir base && unzip -q base.zip -d base
          SRC="$(find base -name 'TonoFino-Studio-v1.9.1-android-source.zip' -print -quit)"; test -s "$SRC"
          unzip -q "$SRC" -d .
          rm -rf tonofino-android/.git tonofino-android/.gradle
          cat tonofino-ci/v20_patch_{00..03}.b64 | base64 -d > v20.patch.gz
          test "$(sha256sum v20.patch.gz | cut -d' ' -f1)" = "13487d97a7b321b0a0a887328aa55609996fdfcf97e187b54d4d7672270c1ae9"
          gzip -dc v20.patch.gz > v20.patch
          git -C tonofino-android init -q
          git -C tonofino-android apply --check --whitespace=nowarn ../v20.patch
          git -C tonofino-android apply --whitespace=nowarn ../v20.patch
          base64 -d tonofino-ci/v20_new_files.b64 > v20-new-files.tar.gz
          test "$(sha256sum v20-new-files.tar.gz | cut -d' ' -f1)" = "fadfc6530d149aba9f02088499055c5d1d5149226f20efe5ed18aea8552f038f"
          tar -xzf v20-new-files.tar.gz -C tonofino-android
          test -s tonofino-android/app/src/main/assets/public/js/music-tools.js
          test -s tonofino-android/qa/music-tools-selftest.mjs

      - name: Rebuild launcher safe-zone
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('tonofino-android'); src=Image.open(root/'app/src/main/assets/public/assets/brand-icon.png').convert('RGB')
          px=src.load(); pts=[(x,y) for y in range(src.height) for x in range(src.width) if max(px[x,y])>28]
          xs=[p[0] for p in pts]; ys=[p[1] for p in pts]; crop=src.crop((min(xs),min(ys),max(xs)+1,max(ys)+1))
          h=int(src.height*.605); w=round(crop.width*h/crop.height); safe=Image.new('RGB',src.size,(0,0,0)); safe.paste(crop.resize((w,h),Image.Resampling.LANCZOS),((src.width-w)//2,(src.height-h)//2))
          assets=root/'app/src/main/assets/public/assets'
          for size,name in [(512,'brand-icon.png'),(192,'icon-192.png'),(512,'icon-512.png')]: safe.resize((size,size),Image.Resampling.LANCZOS).save(assets/name,optimize=True)
          rgba=safe.convert('RGBA'); rgba.putdata([(r,g,b,0 if max(r,g,b)<24 else 255) for r,g,b,a in rgba.getdata()]); rgba.resize((432,432),Image.Resampling.LANCZOS).save(root/'app/src/main/res/drawable-nodpi/ic_launcher_foreground_brand.png',optimize=True)
          for dens,size in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
            im=safe.resize((size,size),Image.Resampling.LANCZOS); d=root/f'app/src/main/res/mipmap-{dens}'; im.save(d/'ic_launcher.png'); im.save(d/'ic_launcher_round.png')
          safe.resize((512,512),Image.Resampling.LANCZOS).save('icon-safe-preview.png'); assert h/src.height <= .66
          PY

      - name: Test JavaScript, theory and pitch detector
        shell: bash
        run: |
          set -euo pipefail
          find tonofino-android/app/src/main/assets/public/js -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          node tonofino-android/qa/music-tools-selftest.mjs
          node tonofino-android/qa/static-contract-v2.mjs
          mkdir -p java-test
          javac -d java-test tonofino-android/app/src/main/java/com/tonofino/studio/PitchDetector.java tonofino-android/qa/PitchDetectorSelfTest.java
          java -cp java-test PitchDetectorSelfTest
          grep -q "versionCode 21" tonofino-android/app/build.gradle
          grep -q "versionName '2.0.0'" tonofino-android/app/build.gradle

      - name: Build, sign and inspect APK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > tonofino-android/local.properties
          gradle -p tonofino-android assembleDebug --no-daemon --stacktrace
          mkdir artifacts
          cp tonofino-android/app/build/outputs/apk/debug/app-debug.apk artifacts/TonoFino-Studio-v2.0.0-QA.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/TonoFino-Studio-v2.0.0-QA.apk > artifacts/apksigner.txt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump badging artifacts/TonoFino-Studio-v2.0.0-QA.apk > artifacts/badging.txt
          grep -q "package: name='com.tonofino.studio.qa20'" artifacts/badging.txt
          grep -q "versionCode='21'" artifacts/badging.txt
          grep -q "versionName='2.0.0-qa'" artifacts/badging.txt
          grep -q "targetSdkVersion:'36'" artifacts/badging.txt
          unzip -t artifacts/TonoFino-Studio-v2.0.0-QA.apk > artifacts/integrity.txt
          sha256sum artifacts/TonoFino-Studio-v2.0.0-QA.apk > artifacts/TonoFino-Studio-v2.0.0-QA.apk.sha256

      - name: Clean Android install and two cold starts
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$HOME/.android/avd"; mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name tf_v20 --package "system-images;android-35;google_apis;x86_64" --device pixel_6
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd tf_v20 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > emulator.log 2>&1 &
          EPID=$!; trap 'kill $EPID 2>/dev/null || true' EXIT
          adb wait-for-device
          for i in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break; sleep 2; done
          PKG=com.tonofino.studio.qa20; APK=artifacts/TonoFino-Studio-v2.0.0-QA.apk
          adb install "$APK" | tee artifacts/adb-install.txt | grep -q Success
          adb shell pm grant "$PKG" android.permission.RECORD_AUDIO
          for n in 1 2; do
            adb shell am force-stop "$PKG" || true; adb logcat -c
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/tmp/launch$n.txt
            sleep 6; test -n "$(adb shell pidof "$PKG" | tr -d '\r')"
            adb logcat -d > artifacts/logcat-$n.txt
            if grep -A30 -B5 'FATAL EXCEPTION' artifacts/logcat-$n.txt | grep -q "$PKG"; then exit 1; fi
          done
          echo 'Android install + two cold starts: PASS' > artifacts/android-smoke-test.txt

      - name: Package delivery
        shell: bash
        run: |
          cp icon-safe-preview.png artifacts/icon-safe-preview.png
          zip -qr artifacts/TonoFino-Studio-v2.0.0-android-source.zip tonofino-android

      - uses: actions/upload-artifact@v4
        with:
          name: TonoFino-Studio-v2.0.0-QA-final
          path: artifacts/*
          if-no-files-found: error
