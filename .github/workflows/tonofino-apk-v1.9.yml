name: TonoFino APK v1.9 Studio

on:
  push:
    branches:
      - build/tonofino-v1.9-studio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build, test and verify TonoFino Studio 1.9
        shell: bash
        run: |
          set +e
          bash tonofino-ci/build-v19-fixed.sh > tonofino-v19-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "TonoFino v1.9 build failed with status $status. Last 240 log lines:"
            tail -240 tonofino-v19-build.log
            exit "$status"
          fi
          tail -120 tonofino-v19-build.log

      - name: Upload concise build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TonoFino-v1.9-build-log
          path: tonofino-v19-build.log
          if-no-files-found: warn

      - name: Upload verified APK and source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TonoFino-Studio-v1.9.0-studio
          path: artifacts/*
          if-no-files-found: error
