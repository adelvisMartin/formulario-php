name: TonoFino APK v1.9 Studio

on:
  push:
    branches:
      - build/tonofino-v1.9-studio
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build, unit-test and verify TonoFino Studio 1.9
        shell: bash
        run: |
          set +e
          sed -i 's/dc736bdbb78fdcd35c028712cf29a46e1e01565c1c32a87dddb26a304b9c1bd0/e784d4950dc9b8298c625eff5bfbaaf5e90b2a0e093057f35c55b59eefde99de/' tonofino-ci/build-v19.sh
          sed -i 's/scheduleAheadTime/lookaheadMs/' tonofino-ci/build-v19.sh
          sed -i 's/grep -q "AFINADA"/grep -q "guided-string-state"/' tonofino-ci/build-v19.sh
          sed -i "/sdkVersion:'26'/d" tonofino-ci/build-v19.sh
          bash -x tonofino-ci/build-v19.sh > tonofino-v19-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "TonoFino v1.9 build failed with status $status. Last 240 log lines:"
            tail -240 tonofino-v19-build.log
            exit "$status"
          fi
          grep -q "minSdk 26" tonofino-android/app/build.gradle
          grep -q "targetSdkVersion:'36'" artifacts/apk-badging.txt
          tail -120 tonofino-v19-build.log

      - name: Build side-by-side phone QA APK
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/applicationIdSuffix '.debug'/applicationIdSuffix '.qa'/" tonofino-android/app/build.gradle
          sed -i "s/versionNameSuffix '-debug'/versionNameSuffix '-qa'/" tonofino-android/app/build.gradle
          sed -i 's/android:label="TonoFino Studio"/android:label="TonoFino Studio 1.9 QA"/' tonofino-android/app/src/main/AndroidManifest.xml
          gradle -p tonofino-android assembleDebug --no-daemon --stacktrace
          cp tonofino-android/app/build/outputs/apk/debug/app-debug.apk artifacts/TonoFino-Studio-v1.9.0-QA.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/TonoFino-Studio-v1.9.0-QA.apk > artifacts/qa-apksigner.txt
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump badging artifacts/TonoFino-Studio-v1.9.0-QA.apk > artifacts/qa-badging.txt
          grep -q "package: name='com.tonofino.studio.qa'" artifacts/qa-badging.txt
          grep -q "versionCode='19'" artifacts/qa-badging.txt
          grep -q "versionName='1.9.0-qa'" artifacts/qa-badging.txt
          grep -q "application-label:'TonoFino Studio 1.9 QA'" artifacts/qa-badging.txt
          grep -q "targetSdkVersion:'36'" artifacts/qa-badging.txt
          unzip -t artifacts/TonoFino-Studio-v1.9.0-QA.apk > artifacts/qa-apk-integrity.txt
          sha256sum artifacts/TonoFino-Studio-v1.9.0-QA.apk > artifacts/TonoFino-Studio-v1.9.0-QA.apk.sha256

      - name: Download verified v1.8 APK for coexistence test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p v18-artifact
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8971250554/zip" \
            -o v18-artifact.zip
          unzip -q v18-artifact.zip -d v18-artifact
          V18_APK="$(find v18-artifact -type f -name 'TonoFino-Studio-v1.8.0-debug.apk' -print -quit)"
          test -n "$V18_APK"
          test -s "$V18_APK"
          echo "V18_APK=$V18_APK" >> "$GITHUB_ENV"

      - name: Install Android emulator image and create clean device
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --force --name tonofino_qa --package "system-images;android-35;google_apis;x86_64" --device "pixel_6"
          avdmanager list avd
          test -f "$ANDROID_AVD_HOME/tonofino_qa.ini"

      - name: Install v1.8 then v1.9 QA side-by-side and cold-start test
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check || true
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd tonofino_qa -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > emulator.log 2>&1 &
          EMULATOR_PID=$!
          trap 'kill $EMULATOR_PID 2>/dev/null || true' EXIT

          DEVICE_READY=0
          for i in $(seq 1 90); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo 'Emulator exited before ADB became available:'
              cat emulator.log
              exit 1
            fi
            if adb devices | grep -q '^emulator-.*device$'; then
              DEVICE_READY=1
              break
            fi
            sleep 2
          done
          test "$DEVICE_READY" = "1"

          BOOT_READY=0
          for i in $(seq 1 120); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo 'Emulator exited during Android boot:'
              cat emulator.log
              exit 1
            fi
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              BOOT_READY=1
              break
            fi
            sleep 2
          done
          test "$BOOT_READY" = "1"
          adb shell input keyevent 82 || true

          V18_PACKAGE="com.tonofino.studio.debug"
          QA_PACKAGE="com.tonofino.studio.qa"
          QA_APK="artifacts/TonoFino-Studio-v1.9.0-QA.apk"

          test -s "$V18_APK"
          test -s "$QA_APK"
          adb uninstall "$V18_PACKAGE" >/dev/null 2>&1 || true
          adb uninstall "$QA_PACKAGE" >/dev/null 2>&1 || true

          INSTALL_V18="$(adb install "$V18_APK")"
          echo "$INSTALL_V18"
          echo "$INSTALL_V18" | grep -q 'Success'
          adb shell pm path "$V18_PACKAGE" | grep -q '^package:'

          INSTALL_QA="$(adb install "$QA_APK")"
          echo "$INSTALL_QA"
          echo "$INSTALL_QA" | grep -q 'Success'
          adb shell pm path "$QA_PACKAGE" | grep -q '^package:'

          # The old v1.8 must still be installed after v1.9 QA is installed.
          adb shell pm path "$V18_PACKAGE" | grep -q '^package:'
          adb shell pm list packages | grep -q "package:$V18_PACKAGE"
          adb shell pm list packages | grep -q "package:$QA_PACKAGE"
          adb shell dumpsys package "$QA_PACKAGE" | grep -q 'android.permission.RECORD_AUDIO'

          adb logcat -c
          adb shell monkey -p "$QA_PACKAGE" -c android.intent.category.LAUNCHER 1 >/tmp/launch1.txt
          cat /tmp/launch1.txt
          sleep 7
          PID1="$(adb shell pidof "$QA_PACKAGE" | tr -d '\r')"
          test -n "$PID1"
          adb shell dumpsys activity activities | grep -q "$QA_PACKAGE"
          adb logcat -d > first-launch-logcat.txt
          if grep -A30 -B5 'FATAL EXCEPTION' first-launch-logcat.txt | grep -q "$QA_PACKAGE"; then
            echo 'Crash detected on first launch'
            grep -A30 -B5 'FATAL EXCEPTION' first-launch-logcat.txt
            exit 1
          fi

          adb shell pm grant "$QA_PACKAGE" android.permission.RECORD_AUDIO
          adb shell dumpsys package "$QA_PACKAGE" | grep -A3 'android.permission.RECORD_AUDIO' | grep -q 'granted=true'

          adb shell am force-stop "$QA_PACKAGE"
          adb logcat -c
          adb shell monkey -p "$QA_PACKAGE" -c android.intent.category.LAUNCHER 1 >/tmp/launch2.txt
          cat /tmp/launch2.txt
          sleep 7
          PID2="$(adb shell pidof "$QA_PACKAGE" | tr -d '\r')"
          test -n "$PID2"
          adb logcat -d > second-launch-logcat.txt
          if grep -A30 -B5 'FATAL EXCEPTION' second-launch-logcat.txt | grep -q "$QA_PACKAGE"; then
            echo 'Crash detected on second cold start'
            grep -A30 -B5 'FATAL EXCEPTION' second-launch-logcat.txt
            exit 1
          fi

          {
            echo 'TonoFino Studio v1.9.0 side-by-side Android install test: PASS'
            echo 'Existing v1.8 package retained: PASS'
            echo 'v1.9 QA adb install while v1.8 remains installed: PASS'
            echo "v1.8 package: $(adb shell pm path "$V18_PACKAGE" | tr -d '\r')"
            echo "v1.9 QA package: $(adb shell pm path "$QA_PACKAGE" | tr -d '\r')"
            echo "First QA launch PID: $PID1"
            echo "Second QA launch PID: $PID2"
            echo 'RECORD_AUDIO declaration: PASS'
            echo 'RECORD_AUDIO runtime grant: PASS'
            echo 'Fatal exception scan, first launch: PASS'
            echo 'Fatal exception scan, second launch: PASS'
          } | tee artifacts/side-by-side-install-smoke-test.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TonoFino-v1.9-qa-diagnostics
          path: |
            tonofino-v19-build.log
            emulator.log
            first-launch-logcat.txt
            second-launch-logcat.txt
          if-no-files-found: warn

      - name: Upload phone QA APK and verification files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TonoFino-Studio-v1.9.0-phone-QA-verified
          path: |
            artifacts/TonoFino-Studio-v1.9.0-QA.apk
            artifacts/TonoFino-Studio-v1.9.0-QA.apk.sha256
            artifacts/qa-apksigner.txt
            artifacts/qa-badging.txt
            artifacts/qa-apk-integrity.txt
            artifacts/side-by-side-install-smoke-test.txt
          if-no-files-found: error
