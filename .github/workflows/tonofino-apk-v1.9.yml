name: TonoFino APK v1.9 Studio

on:
  push:
    branches:
      - build/tonofino-v1.9-studio
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build, test and verify TonoFino Studio 1.9
        shell: bash
        run: bash tonofino-ci/build-v19-fixed.sh

      - uses: actions/upload-artifact@v4
        with:
          name: TonoFino-Studio-v1.9.0-studio
          path: artifacts/*
          if-no-files-found: error
