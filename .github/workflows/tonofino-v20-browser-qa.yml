name: TonoFino v2.0 browser QA

on:
  push:
    branches:
      - build/tonofino-v2.0-music-lab
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v2 web assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9017752309/zip" -o base.zip
          mkdir base && unzip -q base.zip -d base
          SRC="$(find base -name 'TonoFino-Studio-v1.9.1-android-source.zip' -print -quit)"
          unzip -q "$SRC" -d .
          rm -rf tonofino-android/.git tonofino-android/.gradle
          cat tonofino-ci/v20_patch_{00..03}.b64 | base64 -d > v20.patch.gz
          test "$(sha256sum v20.patch.gz | cut -d' ' -f1)" = "13487d97a7b321b0a0a887328aa55609996fdfcf97e187b54d4d7672270c1ae9"
          gzip -dc v20.patch.gz > v20.patch
          git -C tonofino-android init -q
          git -C tonofino-android apply --whitespace=nowarn ../v20.patch
          find tonofino-android/app/src/main/assets/public/js -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Install Playwright and axe
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium >/dev/null

      - name: Render all critical routes at 3 viewport sizes
        shell: bash
        run: |
          set -euo pipefail
          mkdir browser-qa
          cat > browser-qa/run.mjs <<'EOF'
          import { chromium } from 'playwright';
          import AxeBuilder from '@axe-core/playwright';
          import fs from 'node:fs';
          const routes=['home','tuner','metronome','tone','fretboard','chords','scales','ear','analyzer','intonation','songbook','practice','settings','qa'];
          const viewports=[{name:'phone',width:375,height:812},{name:'tablet',width:768,height:1024},{name:'desktop',width:1440,height:900}];
          const browser=await chromium.launch({headless:true});
          const failures=[]; const report=[];
          for(const vp of viewports){
            const context=await browser.newContext({viewport:{width:vp.width,height:vp.height}});
            const page=await context.newPage();
            for(const route of routes){
              const errors=[];
              const onPageError=e=>errors.push(`pageerror:${String(e)}`);
              const onConsole=m=>{if(m.type()==='error'&&!m.text().includes('404'))errors.push(`console:${m.text()}`)};
              page.on('pageerror',onPageError); page.on('console',onConsole);
              await page.goto(`http://127.0.0.1:5179/?qa=1#/${route}`,{waitUntil:'networkidle'});
              await page.waitForTimeout(250);
              const metrics=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,innerWidth:innerWidth,text:(document.querySelector('main')?.innerText||'').trim().length,buttons:[...document.querySelectorAll('button')].filter(b=>b.offsetParent!==null).length}));
              if(metrics.scrollWidth>metrics.innerWidth+3 && !['fretboard','chords','scales'].includes(route)) failures.push(`${vp.name}/${route}: horizontal overflow ${metrics.scrollWidth}>${metrics.innerWidth}`);
              if(metrics.text<40) failures.push(`${vp.name}/${route}: empty view`);
              if(errors.length) failures.push(`${vp.name}/${route}: ${errors.join(' | ')}`);
              const axe=await new AxeBuilder({page}).withTags(['wcag2a','wcag2aa']).analyze();
              const severe=axe.violations.filter(v=>['critical','serious'].includes(v.impact));
              if(severe.length) failures.push(`${vp.name}/${route}: axe ${severe.map(v=>v.id).join(',')}`);
              report.push({viewport:vp.name,route,metrics,axeViolations:axe.violations.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.length}))});
              if(['tuner','metronome','chords','scales','ear','analyzer','intonation','songbook'].includes(route)) await page.screenshot({path:`browser-qa/${route}-${vp.width}x${vp.height}.png`,fullPage:true});
              page.off('pageerror',onPageError); page.off('console',onConsole);
            }
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('browser-qa/report.json',JSON.stringify({failures,report},null,2));
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          console.log(`Browser QA PASS: ${report.length} route/viewport combinations`);
          EOF
          cd tonofino-android/app/src/main/assets/public
          python3 -m http.server 5179 --bind 127.0.0.1 >/tmp/tf-web.log 2>&1 & SERVER=$!
          cd "$GITHUB_WORKSPACE"
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          sleep 1
          node browser-qa/run.mjs
          kill $SERVER 2>/dev/null || true
          trap - EXIT

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TonoFino-v2.0-browser-QA
          path: browser-qa/*
          if-no-files-found: warn
