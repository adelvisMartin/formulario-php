name: TonoFino v2.0 browser QA a11y
on:
  push:
    branches: [build/tonofino-v2.0-music-lab]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct TonoFino 2 web source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9017752309/zip" -o base.zip
          mkdir base && unzip -q base.zip -d base
          SRC="$(find base -name 'TonoFino-Studio-v1.9.1-android-source.zip' -print -quit)"; unzip -q "$SRC" -d .
          rm -rf tonofino-android/.git tonofino-android/.gradle
          cat tonofino-ci/v20_patch_{00..03}.b64 | base64 -d > v20.patch.gz
          gzip -dc v20.patch.gz > v20.patch
          git -C tonofino-android init -q && git -C tonofino-android apply --whitespace=nowarn ../v20.patch
          base64 -d tonofino-ci/v20_new_files.b64 > new.tar.gz
          test "$(sha256sum new.tar.gz | cut -d' ' -f1)" = "fadfc6530d149aba9f02088499055c5d1d5149226f20efe5ed18aea8552f038f"
          tar -xzf new.tar.gz -C tonofino-android
          python3 tonofino-ci/v20_a11y_fix.py tonofino-android
          find tonofino-android/app/src/main/assets/public/js -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install Playwright and axe
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium >/dev/null
      - name: Render routes at phone tablet desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir browser-qa
          cat > browser-qa/run.mjs <<'EOF'
          import { chromium } from 'playwright';
          import AxeBuilder from '@axe-core/playwright';
          import fs from 'node:fs';
          const routes=['home','tuner','metronome','tone','fretboard','chords','scales','ear','analyzer','intonation','songbook','practice','settings','qa'];
          const vps=[{n:'phone',w:375,h:812},{n:'tablet',w:768,h:1024},{n:'desktop',w:1440,h:900}];
          const browser=await chromium.launch({headless:true}); const failures=[]; const report=[];
          for(const vp of vps){const ctx=await browser.newContext({viewport:{width:vp.w,height:vp.h}});const page=await ctx.newPage();
            for(const route of routes){const errors=[];const pe=e=>errors.push(String(e));const ce=m=>{if(m.type()==='error'&&!m.text().includes('404'))errors.push(m.text())};page.on('pageerror',pe);page.on('console',ce);
              await page.goto(`http://127.0.0.1:5179/?qa=1#/${route}`,{waitUntil:'networkidle'});await page.waitForTimeout(250);
              const m=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth,text:(document.querySelector('main')?.innerText||'').trim().length}));
              if(m.sw>m.iw+3&&!['fretboard','chords','scales'].includes(route))failures.push(`${vp.n}/${route}: overflow ${m.sw}>${m.iw}`);if(m.text<40)failures.push(`${vp.n}/${route}: empty`);if(errors.length)failures.push(`${vp.n}/${route}: ${errors.join('|')}`);
              const axe=await new AxeBuilder({page}).withTags(['wcag2a','wcag2aa']).analyze();const critical=axe.violations.filter(v=>v.impact==='critical');if(critical.length)failures.push(`${vp.n}/${route}: critical axe ${critical.map(v=>v.id).join(',')}`);
              report.push({viewport:vp.n,route,metrics:m,violations:axe.violations.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.length}))});
              if(['tuner','metronome','chords','scales','ear','analyzer','intonation','songbook'].includes(route))await page.screenshot({path:`browser-qa/${route}-${vp.w}x${vp.h}.png`,fullPage:true});page.off('pageerror',pe);page.off('console',ce);
            }await ctx.close();}
          await browser.close();fs.writeFileSync('browser-qa/report.json',JSON.stringify({failures,report},null,2));if(failures.length){console.error(failures.join('\n'));process.exit(1)}console.log(`PASS ${report.length} checks`);
          EOF
          cd tonofino-android/app/src/main/assets/public
          python3 -m http.server 5179 --bind 127.0.0.1 >/tmp/tfweb.log 2>&1 & SERVER=$!
          cd "$GITHUB_WORKSPACE"; trap 'kill $SERVER 2>/dev/null || true' EXIT; sleep 1
          node browser-qa/run.mjs
          kill $SERVER 2>/dev/null || true; trap - EXIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TonoFino-v2.0-browser-QA-a11y
          path: browser-qa/*
          if-no-files-found: warn
