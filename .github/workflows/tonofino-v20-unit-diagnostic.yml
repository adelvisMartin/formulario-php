name: TonoFino v2 unit diagnostic
on:
  push:
    branches: [build/tonofino-v2.0-music-lab]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and test
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          {
            curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9017752309/zip" -o base.zip
            mkdir base && unzip -q base.zip -d base
            SRC="$(find base -name 'TonoFino-Studio-v1.9.1-android-source.zip' -print -quit)"
            unzip -q "$SRC" -d .
            rm -rf tonofino-android/.git tonofino-android/.gradle
            cat tonofino-ci/v20_patch_{00..03}.b64 | base64 -d > v20.patch.gz
            gzip -dc v20.patch.gz > v20.patch
            git -C tonofino-android init -q
            git -C tonofino-android apply --whitespace=nowarn ../v20.patch
            echo '--- JS syntax ---'
            find tonofino-android/app/src/main/assets/public/js -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check; echo status=$?
            echo '--- music tests ---'
            node tonofino-android/qa/music-tools-selftest.mjs; echo status=$?
            echo '--- static tests ---'
            node tonofino-android/qa/static-contract-v2.mjs; echo status=$?
            echo '--- files ---'
            ls -la tonofino-android/qa
            echo '--- gradle contract ---'
            grep -n "versionCode\|versionName\|applicationIdSuffix" tonofino-android/app/build.gradle
            echo '--- javac ---'
            mkdir -p java-test
            javac -d java-test tonofino-android/app/src/main/java/com/tonofino/studio/PitchDetector.java tonofino-android/qa/PitchDetectorSelfTest.java; echo javac=$?
            java -cp java-test PitchDetectorSelfTest; echo java=$?
          } 2>&1 | tee unit-diagnostic.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TonoFino-v20-unit-diagnostic
          path: unit-diagnostic.txt
